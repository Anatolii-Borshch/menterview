syntax = "proto3";
package session;

service SessionService {
  rpc InitializeSession(InitializeSessionRequest) returns (InitializeSessionResponse);
  rpc TerminateSession(TerminateSessionRequest)   returns (TerminateSessionResponse);
}

message SessionQuestion {
  int64  question_id    = 1;
  string question_text  = 2;
  string answer         = 3;
  int32  category_id    = 4;
  int32  difficulty_id  = 5;
  bool   is_weak_topic  = 6;
  string rephrased_text = 7;
}

message InitializeSessionRequest {
  int64                    session_id       = 1;
  string                   session_token    = 2;
  repeated SessionQuestion questions        = 3;
  string                   callback_address = 4;
}

message InitializeSessionResponse {
  bool   success = 1;
  string message = 2;
}

message TerminateSessionRequest {
  int64 session_id = 1;
}

message TerminateSessionResponse {
  bool success = 1;
}